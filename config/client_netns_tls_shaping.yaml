# TLS client config + shaping for Phase 9 "after" experiments.
# Same shaping pipeline as server for symmetric shaping.

client:
  tun_name: tun1
  tun_ip: 10.8.0.2
  tun_peer: 10.8.0.1
  mtu: 1400

server:
  host: 192.168.200.1
  port: 2222

transport:
  type: tls
  cafile: config/certs/cert.pem
  verify_server: false
  insecure_skip_verify: true

session:
  heartbeat_interval: 10
  reconnect: true
  reconnect_interval: 3

shaping:
  enabled: true
  padding_enabled: true
  min_padding_bytes: 8
  max_padding_bytes: 64
  aggregation_enabled: true
  aggregation_max_delay_ms: 50.0
  aggregation_max_bytes: 4096
  jitter_enabled: true
  jitter_min_ms: 5.0
  jitter_max_ms: 50.0
