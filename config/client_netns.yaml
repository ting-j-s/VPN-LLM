# TCP Transport Client Configuration for Network Namespace Testing
# Use with: sudo ip netns exec vpn_cli python -m src.client --config config/client_netns.yaml --transport tcp

client:
  tun_name: tun1
  tun_ip: 10.8.0.2
  tun_peer: 10.8.0.1
  mtu: 1400

server:
  host: 192.168.100.1
  port: 2222

transport:
  type: tcp

session:
  heartbeat_interval: 10
  reconnect: true
  reconnect_interval: 3