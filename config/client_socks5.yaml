# SOCKS5 Transport Client Configuration
client:
  tun_name: tun0
  tun_ip: 10.8.0.2
  tun_peer: 10.8.0.1
  mtu: 1400

server:
  host: 127.0.0.1
  port: 2226

transport:
  type: socks5
  socks5_proxy_host: 127.0.0.1
  socks5_proxy_port: 2226

session:
  heartbeat_interval: 10
  reconnect: true
  reconnect_interval: 3
