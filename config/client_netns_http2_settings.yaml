# HTTP/2 Transport Client Configuration with SETTINGS profile (Phase 10E-B)
# Requires: pip install h2
#
# Extends Phase 10E-A multi-stream with HTTP/2 SETTINGS profile randomization.
# NOT browser-emulating — evaluates HTTP/2 SETTINGS impact on trace shape only.
# Settings must not be interpreted as browser mimicry.

client:
  tun_name: tun1
  tun_ip: 10.8.0.2
  tun_peer: 10.8.0.1
  mtu: 1400

server:
  host: 192.168.200.1
  port: 2225

transport:
  type: http2
  experimental: true
  http2_chunk_min_size: 256
  http2_chunk_max_size: 1400
  http2_window_update_threshold: 65535
  http2_chunk_rng_seed: 42
  http2_stream_count: 4
  http2_stream_assignment: "round_robin"
  http2_stream_rng_seed: 42
  http2_max_concurrent_streams: 8
  http2_settings_profile: "browser_like_low_variance"
  http2_settings_enable_randomization: true
  http2_settings_rng_seed: 42

session:
  heartbeat_interval: 10
  reconnect: true
  reconnect_interval: 3

shaping:
  enabled: true
  padding_enabled: true
  min_padding_bytes: 8
  max_padding_bytes: 64
  aggregation_enabled: true
  aggregation_max_delay_ms: 50.0
  aggregation_max_bytes: 4096
  jitter_enabled: true
  jitter_min_ms: 5.0
  jitter_max_ms: 50.0
