# TLS client config for Phase 9 netns experiments.
# Based on client_netns.yaml + client_tls.yaml TLS settings.

client:
  tun_name: tun1
  tun_ip: 10.8.0.2
  tun_peer: 10.8.0.1
  mtu: 1400

server:
  host: 192.168.200.1
  port: 2222

transport:
  type: tls
  cafile: config/certs/cert.pem
  verify_server: false
  insecure_skip_verify: true

session:
  heartbeat_interval: 10
  reconnect: true
  reconnect_interval: 3
