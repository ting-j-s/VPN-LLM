# TLS Transport Client Configuration
client:
  tun_name: tun0
  tun_ip: 10.8.0.2
  tun_peer: 10.8.0.1
  mtu: 1400

server:
  host: 127.0.0.1
  port: 2223

transport:
  type: tls
  certfile: /path/to/client.crt
  keyfile: /path/to/client.key
  cafile: /path/to/ca.crt
  verify_server: true

session:
  heartbeat_interval: 10
  reconnect: true
  reconnect_interval: 3