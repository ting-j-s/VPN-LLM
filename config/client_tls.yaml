# TLS Transport Client Configuration
client:
  tun_name: tun0
  tun_ip: 10.8.0.2
  tun_peer: 10.8.0.1
  mtu: 1400

server:
  host: 127.0.0.1
  port: 2222

transport:
  type: tls
  cafile: cert.pem
  verify_server: false
  insecure_skip_verify: true

session:
  heartbeat_interval: 10
  reconnect: true
  reconnect_interval: 3
