# HTTP/2 Transport Client Configuration for Network Namespace Testing
# Use with: sudo ip netns exec vpn_cli python -m src.client --config config/client_netns_http2.yaml --transport http2
#
# Requires: pip install h2
# Without h2, the transport is importable but connect() raises TransportError.

client:
  tun_name: tun1
  tun_ip: 10.8.0.2
  tun_peer: 10.8.0.1
  mtu: 1400

server:
  host: 192.168.200.1
  port: 2225

transport:
  type: http2
  experimental: true

session:
  heartbeat_interval: 10
  reconnect: true
  reconnect_interval: 3
