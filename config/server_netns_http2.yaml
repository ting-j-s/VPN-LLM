# HTTP/2 Transport Server Configuration for Network Namespace Testing
# Use with: sudo ip netns exec vpn_srv python -m src.server --config config/server_netns_http2.yaml --transport http2
#
# Requires: pip install h2
# Without h2, the transport is importable but connect() raises TransportError.

server:
  tun_name: tun0
  tun_ip: 10.8.0.1
  tun_peer: 10.8.0.2
  mtu: 1400
  listen_port: 2225

forwarding:
  enable_nat: false
  enable_route: true

transport:
  type: http2
  experimental: true

session:
  heartbeat_timeout: 30
