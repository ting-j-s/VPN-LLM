# Server config with shaping enabled for Phase 9 "after" phase.
# Mirrors config/examples/shaping_padding_aggregation_netns.yaml shaping section
# so that both tunnel endpoints use the same shaping pipeline.

server:
  tun_name: tun0
  tun_ip: 10.8.0.1
  tun_peer: 10.8.0.2
  mtu: 1400
  listen_port: 2222

forwarding:
  enable_nat: false
  enable_route: true

transport:
  type: tcp

session:
  heartbeat_timeout: 30

shaping:
  enabled: true
  padding_enabled: true
  min_padding_bytes: 8
  max_padding_bytes: 64
  aggregation_enabled: true
  aggregation_max_delay_ms: 50.0
  aggregation_max_bytes: 4096
  jitter_enabled: true
  jitter_min_ms: 5.0
  jitter_max_ms: 50.0
