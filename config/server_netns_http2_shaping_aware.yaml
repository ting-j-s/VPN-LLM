# HTTP/2 Transport Server Configuration with HTTP/2-aware shaping (Phase 10D)
# Requires: pip install h2
#
# Extends generic shaping (padding/aggregation/jitter) with HTTP/2-specific
# countermeasures: DATA frame size randomization and WINDOW_UPDATE batching.

server:
  tun_name: tun0
  tun_ip: 10.8.0.1
  tun_peer: 10.8.0.2
  mtu: 1400
  listen_port: 2225

forwarding:
  enable_nat: false
  enable_route: true

transport:
  type: http2
  experimental: true
  http2_chunk_min_size: 256
  http2_chunk_max_size: 1400
  http2_window_update_threshold: 65535
  http2_chunk_rng_seed: 42

session:
  heartbeat_timeout: 30

shaping:
  enabled: true
  padding_enabled: true
  min_padding_bytes: 8
  max_padding_bytes: 64
  aggregation_enabled: true
  aggregation_max_delay_ms: 50.0
  aggregation_max_bytes: 4096
  jitter_enabled: true
  jitter_min_ms: 5.0
  jitter_max_ms: 50.0
