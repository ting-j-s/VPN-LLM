# TLS Transport Server Configuration
server:
  tun_name: tun0
  tun_ip: 10.8.0.1
  tun_peer: 10.8.0.2
  mtu: 1400
  listen_mode: tls
  listen_port: 2223

transport:
  type: tls
  certfile: /path/to/server.crt
  keyfile: /path/to/server.key

forwarding:
  enable_nat: false
  enable_route: true

session:
  heartbeat_timeout: 30